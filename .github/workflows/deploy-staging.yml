name: Deploy staging

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to staging VM
    runs-on: [self-hosted, Windows, X64]
    environment: staging
    timeout-minutes: 3

    steps:
      - name: Write SSH private key
        shell: powershell
        env:
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          $keyPath = Join-Path $env:RUNNER_TEMP "staging_key"
          $privateKey = $env:STAGING_SSH_KEY.Trim()
          Set-Content -Path $keyPath -Value $privateKey -NoNewline -Encoding ascii
          icacls $keyPath /inheritance:r
          icacls $keyPath /grant:r "$($env:USERNAME):R"
          "KEY_PATH=$keyPath" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Create remote deploy script
        shell: powershell
        run: |
          $scriptPath = Join-Path $env:RUNNER_TEMP "deploy-staging.sh"

          @(
            "set -e"
            "docker pull ghcr.io/trasonoisy/automated-multi-env-deployment:develop"
            "docker stop staging-app || true"
            "docker rm staging-app || true"
            "docker run -d --name staging-app -p 3000:3000 --restart unless-stopped ghcr.io/trasonoisy/automated-multi-env-deployment:develop"
            "sleep 3"
            "curl -f http://localhost:3000/health"
          ) | Set-Content -Path $scriptPath -Encoding ascii

          "SCRIPT_PATH=$scriptPath" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Test SSH connection
        shell: powershell
        run: |
          ssh -i "$env:KEY_PATH" -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=NUL -o ConnectTimeout=10 "${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }}" "whoami"

      - name: Deploy container over SSH
        shell: powershell
        run: |
          scp -i "$env:KEY_PATH" -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=NUL -o ConnectTimeout=10 "$env:SCRIPT_PATH" "${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }}:/tmp/deploy-staging.sh"
          ssh -i "$env:KEY_PATH" -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=NUL -o ConnectTimeout=10 "${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }}" "bash /tmp/deploy-staging.sh"

      - name: Verify staging from runner
        shell: powershell
        run: |
          curl.exe "http://${{ secrets.STAGING_HOST }}:3000/health"